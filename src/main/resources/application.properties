spring.application.name=eCommerce

# --- Base de datos (sobrescribir con variables de entorno en cada ambiente) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
# Las vistas reciben DTOs; no se mantiene la sesión de Hibernate abierta durante el render.
spring.jpa.open-in-view=false

# --- Web ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# Las imágenes se limitan a 2 MB en ImageService (deben entrar en max_allowed_packet de MySQL).
# El límite del request es mayor para poder rechazarlas con un mensaje claro en vez de cortar la conexión.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=12MB
server.error.whitelabel.enabled=false
spring.devtools.livereload.enabled=true
management.endpoints.web.exposure.include=health

# --- Aplicación ---
# URL pública del sitio (se usa para las URLs de retorno/webhook de la pasarela de pagos).
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Clave Base64 de 256 bits o más. Generar una propia para producción: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTMyYnl0ZXMh}
app.jwt.expiration=${JWT_EXPIRATION:2h}
# Tiempo que un pedido sin pagar mantiene reservado el stock.
app.orders.reservation-time=${ORDER_RESERVATION_TIME:60m}
# Administrador inicial (se crea al arrancar si no existe). Dejar vacío para no crear ninguno.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Pagos ---
# simulated: pasarela falsa para desarrollo | mercadopago: Checkout Pro real
payment.provider=${PAYMENT_PROVIDER:simulated}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.currency=${MP_CURRENCY:ARS}
mercadopago.statement-descriptor=${MP_STATEMENT_DESCRIPTOR:ECOMMERCE}
