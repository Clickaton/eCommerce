<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Carrito')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-4"><i class="bi bi-bag"></i> Carrito de compras</h1>

    <div th:if="${cart.isEmpty()}" class="text-center py-5">
        <i class="bi bi-bag-x fs-1 text-body-secondary"></i>
        <p class="mt-2 text-body-secondary">Tu carrito está vacío.</p>
        <a href="/products" class="btn btn-dark">Ir al catálogo</a>
    </div>

    <div th:unless="${cart.isEmpty()}" class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item py-3" th:each="item : ${cart.items}">
                        <div class="d-flex gap-3 align-items-center flex-wrap">
                            <a th:href="@{/products/{id}(id=${item.productId})}">
                                <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" th:alt="${item.productName}" class="thumb">
                                <div th:unless="${item.imageUrl != null}" class="thumb img-placeholder"><i class="bi bi-image"></i></div>
                            </a>
                            <div class="flex-grow-1">
                                <a th:href="@{/products/{id}(id=${item.productId})}" class="link-dark fw-semibold text-decoration-none" th:text="${item.productName}">Producto</a>
                                <div class="small text-body-secondary" th:text="${'$ ' + #numbers.formatDecimal(item.unitPrice, 1, 'POINT', 2, 'COMMA')} + ' c/u'">$ 0 c/u</div>
                                <div class="small text-danger" th:unless="${item.available}">
                                    <i class="bi bi-exclamation-triangle"></i>
                                    <span th:text="${item.stock > 0} ? 'Solo quedan ' + ${item.stock} + ' unidad(es)' : 'Sin stock'">Sin stock</span>
                                </div>
                            </div>
                            <form th:action="@{/cart/items/{id}(id=${item.productId})}" method="post" class="d-flex gap-1">
                                <label class="visually-hidden" th:for="'qty-' + ${item.productId}">Cantidad</label>
                                <input th:id="'qty-' + ${item.productId}" type="number" name="quantity" min="1"
                                       th:max="${item.stock > 0 ? item.stock : 1}" th:value="${item.quantity}"
                                       class="form-control form-control-sm qty-input" onchange="this.form.submit()">
                                <noscript><button class="btn btn-sm btn-outline-dark" type="submit">Actualizar</button></noscript>
                            </form>
                            <div class="fw-bold text-end" style="min-width: 7rem"
                                 th:text="${'$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0</div>
                            <form th:action="@{/cart/items/{id}/remove(id=${item.productId})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" aria-label="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
            <a href="/products" class="btn btn-link link-dark mt-2"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Resumen</h2>
                    <div class="d-flex justify-content-between">
                        <span>Productos</span><span th:text="${cart.totalQuantity}">0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                        <span>Total</span>
                        <span th:text="${'$ ' + #numbers.formatDecimal(cart.total, 1, 'POINT', 2, 'COMMA')}">$ 0</span>
                    </div>
                    <div th:if="${cart.hasUnavailableItems()}" class="alert alert-warning small">
                        Hay productos sin stock suficiente. Ajustá las cantidades para continuar.
                    </div>
                    <a href="/checkout" class="btn btn-dark w-100"
                       th:classappend="${cart.hasUnavailableItems()} ? 'disabled'">Confirmar compra</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
