<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card mx-auto auth-card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="/resources/images/logo-user.png" alt="" width="64" height="64">
                <h1 class="h4 mt-2">Iniciar sesión</h1>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">Email o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-info">Cerraste sesión correctamente.</div>

            <form th:action="@{/logincheck}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">Ingresar</button>
            </form>
            <p class="text-center mt-3 mb-0 small">¿No tenés cuenta? <a href="/user/register" class="link-dark">Registrate</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
