<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Items y totales de un pedido, compartido entre la vista del cliente y la del administrador -->
<div th:fragment="items(order)" class="card mb-4">
    <div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Producto</th>
                <th class="text-end">Precio unitario</th>
                <th class="text-center">Cantidad</th>
                <th class="text-end">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.productName}">Producto</td>
                <td class="text-end" th:text="${'$ ' + #numbers.formatDecimal(item.unitPrice, 1, 'POINT', 2, 'COMMA')}">$ 0</td>
                <td class="text-center" th:text="${item.quantity}">1</td>
                <td class="text-end" th:text="${'$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="text-end">Total</th>
                <th class="text-end fs-5" th:text="${'$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 2, 'COMMA')}">$ 0</th>
            </tr>
            </tfoot>
        </table>
    </div>
</div>

<div th:fragment="shipping(order)" class="card mb-4">
    <div class="card-body">
        <h2 class="h6 text-uppercase text-body-secondary">Envío</h2>
        <th:block th:if="${order.shippingAddress != null}">
            <p class="mb-1 fw-semibold" th:text="${order.shippingAddress.recipientName}">Nombre</p>
            <p class="mb-1" th:text="${order.shippingAddress}">Dirección</p>
            <p class="mb-0"><i class="bi bi-telephone"></i> <span th:text="${order.shippingAddress.phone}">tel</span></p>
        </th:block>
    </div>
</div>

</body>
</html>
