<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-4"><i class="bi bi-receipt"></i> Mis pedidos</h1>

    <div th:if="${page.empty}" class="text-center py-5 text-body-secondary">
        <p>Todavía no hiciste ningún pedido.</p>
        <a href="/products" class="btn btn-dark">Ir al catálogo</a>
    </div>

    <div th:unless="${page.empty}" class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th class="text-end">Total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${page.content}">
                    <td class="fw-semibold" th:text="'#' + ${order.id}">#1</td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${order.status.badge}" th:text="${order.statusLabel}">Estado</span></td>
                    <td class="text-end" th:text="${'$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 2, 'COMMA')}">$ 0</td>
                    <td class="text-end"><a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-dark">Ver detalle</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/layout :: pagination(${page}, '/orders')}"></nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
