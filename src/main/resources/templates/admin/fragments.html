<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Menú lateral del panel. "section" lo define cada controlador admin. -->
<aside th:fragment="sidebar" class="admin-sidebar col-lg-2 mb-4">
    <div class="card">
        <div class="card-body p-2">
            <div class="px-2 py-2 small text-uppercase text-body-secondary fw-semibold">Administración</div>
            <nav class="nav nav-pills flex-column gap-1">
                <a class="nav-link" th:classappend="${section == 'dashboard'} ? 'active'" href="/admin">
                    <i class="bi bi-speedometer2"></i> Resumen
                </a>
                <a class="nav-link" th:classappend="${section == 'orders'} ? 'active'" href="/admin/orders">
                    <i class="bi bi-receipt"></i> Pedidos
                </a>
                <a class="nav-link" th:classappend="${section == 'products'} ? 'active'" href="/admin/products">
                    <i class="bi bi-box-seam"></i> Productos
                </a>
                <a class="nav-link" th:classappend="${section == 'users'} ? 'active'" href="/admin/users">
                    <i class="bi bi-people"></i> Usuarios
                </a>
                <hr class="my-1">
                <a class="nav-link" href="/products"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
        </div>
    </div>
</aside>

</body>
</html>
