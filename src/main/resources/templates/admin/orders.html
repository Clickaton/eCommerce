<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid px-lg-4 py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="row">
        <aside th:replace="~{admin/fragments :: sidebar}"></aside>

        <div class="col-lg-10">
            <h1 class="h3 mb-3">Pedidos</h1>

            <ul class="nav nav-pills mb-3 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${selectedStatus == null} ? 'active bg-dark' : 'link-dark'" href="/admin/orders">Todos</a>
                </li>
                <li class="nav-item" th:each="s : ${statuses}">
                    <a class="nav-link" th:classappend="${s == selectedStatus} ? 'active bg-dark' : 'link-dark'"
                       th:href="@{/admin/orders(status=${s})}" th:text="${s.label}">Estado</a>
                </li>
            </ul>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th class="text-end">Total</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.empty}">
                            <td colspan="6" class="text-center text-body-secondary py-4">No hay pedidos.</td>
                        </tr>
                        <tr th:each="order : ${page.content}">
                            <td class="fw-semibold" th:text="'#' + ${order.id}">#1</td>
                            <td>
                                <div th:text="${order.customer.fullName}">Cliente</div>
                                <small class="text-body-secondary" th:text="${order.customer.email}">email</small>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</td>
                            <td><span class="badge" th:classappend="'text-bg-' + ${order.status.badge}" th:text="${order.statusLabel}">Estado</span></td>
                            <td class="text-end" th:text="${'$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 2, 'COMMA')}">$ 0</td>
                            <td class="text-end"><a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-dark">Gestionar</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav th:replace="~{fragments/layout :: pagination(${page}, '/admin/orders')}"></nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
